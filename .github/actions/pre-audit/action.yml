name: Arkheionx Pre-Audit Scan
description: GitHub-native pre-audit readiness scanner for indie DeFi protocols.
inputs:
  root:
    description: Repository root to scan.
    required: false
    default: "."
  protocol-type:
    description: "Protocol type: auto, vault, amm, lending, staking, oracle, generic."
    required: false
    default: "auto"
  output:
    description: Markdown report output path.
    required: false
    default: "ARKHEIONX_PRE_AUDIT_REPORT.md"
  json-output:
    description: Optional JSON report output path.
    required: false
    default: ""
  generate-invariant-skeletons:
    description: Generate safe Foundry invariant skeletons.
    required: false
    default: "false"
  fail-on-critical-readiness-gap:
    description: Fail workflow if critical readiness gaps are detected.
    required: false
    default: "false"
  create-issues:
    description: Reserved for future local issue suggestions. No remote issues are created.
    required: false
    default: "false"
  summary:
    description: Write a short Arkheionx report excerpt to the GitHub Actions job summary.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Run Arkheionx pre-audit scanner
      shell: bash
      run: |
        set -euo pipefail

        ARGS=(--root "${{ inputs.root }}" --protocol-type "${{ inputs.protocol-type }}" --output "${{ inputs.output }}")

        if [ -n "${{ inputs.json-output }}" ]; then
          ARGS+=(--json-output "${{ inputs.json-output }}")
        fi

        if [ "${{ inputs.generate-invariant-skeletons }}" = "true" ]; then
          ARGS+=(--generate-invariant-skeletons)
        fi

        if [ "${{ inputs.fail-on-critical-readiness-gap }}" = "true" ]; then
          ARGS+=(--fail-on-critical-readiness-gap)
        fi

        if [ "${{ inputs.create-issues }}" = "true" ]; then
          ARGS+=(--create-issues)
        fi

        python3 "${{ github.action_path }}/../../../scripts/pre_audit_scan.py" "${ARGS[@]}"
        echo "Arkheionx report generated: ${{ inputs.output }}"
        if [ -n "${{ inputs.json-output }}" ]; then
          echo "Arkheionx JSON report generated: ${{ inputs.json-output }}"
        fi

        if [ "${{ inputs.summary }}" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## Arkheionx Pre-Audit Scan"
            echo ""
            echo "- Markdown report: \`${{ inputs.output }}\`"
            if [ -n "${{ inputs.json-output }}" ]; then
              echo "- JSON report: \`${{ inputs.json-output }}\`"
            fi
            if [ -f "${{ inputs.output }}" ]; then
              echo ""
              grep -E "Readiness score:|Score band:|Protocol type:|Protocol confidence:" "${{ inputs.output }}" | head -12 || true
            fi
            echo ""
            echo "This is a pre-audit readiness signal, not a formal audit or security guarantee."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

      - name: Verify unsafe marketing phrases are absent
        run: |
          python3 - <<'PY'
          from pathlib import Path

          phrases = [
              "guaranteed " + "secure",
              "audit " + "replacement",
              "cheap " + "audit",
              "exploit " + "live",
              "d" + "rain helper",
              "profit " + "calculator",
              "bounty " + "guaranteed",
              "fully " + "verified database",
              "autonomous " + "exploit runner",
              "attack " + "live protocol",
              "weapon" + "ize",
              "exploit " + "any protocol",
              "guaranteed " + "bounty",
              "guaranteed " + "findings",
              "auto " + "exploit",
          ]
          roots = [
              Path("README.md"),
              Path("SERVICES.md"),
              Path("docs"),
              Path("docs/PRE_AUDIT_READINESS_OS.md"),
              Path("docs/GITHUB_ACTION_USAGE.md"),
              Path("docs/PR_COMMENT_MODE.md"),
              Path("docs/GENERATED_ISSUE_CHECKLIST.md"),
              Path("docs/ARKHEIONX_CONFIG.md"),
              Path("docs/READINESS_SCORE.md"),
              Path("docs/business/INDIE_BUILDER_OFFER.md"),
              Path("docs/SEARCH_GUIDE.md"),
              Path("docs/marketing/MARKETING_ENGINE.md"),
              Path("docs/business/MONETIZATION.md"),
              Path("docs/business/SPONSORSHIP.md"),
              Path("docs/ETHICS.md"),
              Path(".github/actions"),
              Path("templates"),
          ]
          failures = []
          for root in roots:
              files = [root] if root.is_file() else list(root.rglob("*"))
              for path in files:
                  if not path.is_file() or path.suffix.lower() not in {".md", ".yml", ".yaml", ".sol"}:
                      continue
                  text = path.read_text(encoding="utf-8", errors="ignore").lower()
                  for phrase in phrases:
                      if phrase in text:
                          failures.append(f"{path}: {phrase}")
          if failures:
              raise SystemExit("Unsafe phrase check failed:\n" + "\n".join(failures))
          print("unsafe phrase check passed")
          PY

name: pre-audit-ci

on:
  pull_request:
    paths:
      - "scripts/pre_audit_scan.py"
      - "scripts/post_pr_comment.py"
      - "scripts/create_github_issues.py"
      - "scripts/generate_knowledge_graph.py"
      - "scripts/search_knowledge.py"
      - "tests/**"
      - ".github/actions/pre-audit/action.yml"
      - ".github/workflows/arkheionx-demo.yml"
      - ".github/workflows/pre-audit-ci.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - "examples/mini-vault/**"
      - "examples/vault-risk-fixture/**"
      - "examples/oracle-staking-fixture/**"
      - "examples/oracle-staking-fixture-fixed/**"
      - "examples/semantic-lite-fixture/**"
      - "examples/arkheionx.config.example.json"
      - "examples/reports/**"
      - "metadata/search_terms.json"
      - "metadata/security_memory_graph.json"
      - "metadata/finding_knowledge_map.json"
      - "metadata/rule_calibration_matrix.json"
      - "reports/search_index.md"
      - "reports/security_memory_graph.md"
      - "reports/security_memory_graph_summary.md"
      - "templates/**"
      - "docs/**"
      - "README.md"
      - "SERVICES.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pre-audit-scanner:
    name: validate scanner, action, reports, and safety copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: |
          python3 -m py_compile scripts/pre_audit_scan.py
          python3 -m py_compile scripts/generate_search_index.py
          python3 -m py_compile scripts/post_pr_comment.py
          python3 -m py_compile scripts/create_github_issues.py
          python3 -m py_compile scripts/generate_knowledge_graph.py
          python3 -m py_compile scripts/search_knowledge.py

      - name: Verify search index is current
        run: python3 scripts/generate_search_index.py --check

      - name: Verify security memory graph is current
        run: |
          python3 scripts/generate_knowledge_graph.py --check
          python3 scripts/search_knowledge.py "oracle stale price"
          python3 scripts/search_knowledge.py "missing invariant" --json

      - name: Run scanner unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Run scanner directly against mini-vault
        run: |
          python3 scripts/pre_audit_scan.py \
            --root examples/mini-vault \
            --protocol-type auto \
            --output examples/reports/mini-vault-pre-audit-report.md \
            --json-output examples/reports/mini-vault-pre-audit-report.json \
            --sarif-output examples/reports/mini-vault.sarif.json \
            --baseline-output examples/reports/mini-vault.baseline.json \
            --summary-output examples/reports/mini-vault-action-summary.md \
            --comment-output examples/reports/mini-vault-pr-comment.md \
            --issue-checklist-output examples/reports/mini-vault-issue-checklist.md \
            --issue-plan-output examples/reports/mini-vault-issue-plan.json \
            --generate-invariant-skeletons

      - name: Run scanner directly against vault-risk-fixture
        run: |
          python3 scripts/pre_audit_scan.py \
            --root examples/vault-risk-fixture \
            --protocol-type vault \
            --output examples/reports/vault-risk-fixture-pre-audit-report.md \
            --json-output examples/reports/vault-risk-fixture-pre-audit-report.json \
            --sarif-output examples/reports/vault-risk-fixture.sarif.json \
            --baseline-output examples/reports/vault-risk-fixture.baseline.json \
            --summary-output examples/reports/vault-risk-fixture-action-summary.md \
            --comment-output examples/reports/vault-risk-fixture-pr-comment.md \
            --issue-checklist-output examples/reports/vault-risk-fixture-issue-checklist.md \
            --issue-plan-output examples/reports/vault-risk-fixture-issue-plan.json \
            --generate-invariant-skeletons

      - name: Run scanner directly against oracle-staking-fixture
        run: |
          python3 scripts/pre_audit_scan.py \
            --root examples/oracle-staking-fixture \
            --protocol-type auto \
            --output examples/reports/oracle-staking-fixture-pre-audit-report.md \
            --json-output examples/reports/oracle-staking-fixture-pre-audit-report.json \
            --sarif-output examples/reports/oracle-staking-fixture.sarif.json \
            --baseline-output examples/reports/oracle-staking-fixture.baseline.json \
            --issue-checklist-output examples/reports/oracle-staking-fixture-issue-checklist.md \
            --issue-plan-output examples/reports/oracle-staking-fixture-issue-plan.json \
            --launch-report-output examples/reports/oracle-staking-fixture-launch-report.md \
            --sprint-plan-output examples/reports/oracle-staking-fixture-sprint-plan.md \
            --sprint-days 5 \
            --contest-readiness-output examples/reports/oracle-staking-fixture-contest-readiness.md \
            --executive-summary-output examples/reports/oracle-staking-fixture-executive-summary.md \
            --remediation-roadmap-output examples/reports/oracle-staking-fixture-remediation-roadmap.md

      - name: Run public demo scan
        run: |
          python3 scripts/pre_audit_scan.py \
            --root examples/oracle-staking-fixture \
            --protocol-type auto \
            --output examples/reports/demo-pre-audit-report.md \
            --json-output examples/reports/demo-report.json \
            --sarif-output examples/reports/demo.sarif.json \
            --baseline-output examples/reports/demo.baseline.json \
            --issue-plan-output examples/reports/demo-issue-plan.json \
            --issue-checklist-output examples/reports/demo-issue-checklist.md \
            --launch-report-output examples/reports/demo-launch-report.md \
            --sprint-plan-output examples/reports/demo-sprint-plan.md \
            --sprint-days 5 \
            --contest-readiness-output examples/reports/demo-contest-readiness.md \
            --executive-summary-output examples/reports/demo-executive-summary.md \
            --remediation-roadmap-output examples/reports/demo-remediation-roadmap.md

      - name: Run scanner against oracle-staking fixed fixture
        run: |
          python3 scripts/pre_audit_scan.py \
            --root examples/oracle-staking-fixture-fixed \
            --protocol-type auto \
            --output examples/reports/oracle-staking-fixture-fixed-pre-audit-report.md \
            --json-output examples/reports/oracle-staking-fixture-fixed-pre-audit-report.json \
            --baseline-output examples/reports/oracle-staking-fixture-fixed.baseline.json \
            --launch-report-output examples/reports/oracle-staking-fixture-fixed-launch-report.md \
            --remediation-roadmap-output examples/reports/oracle-staking-fixture-fixed-remediation-roadmap.md

      - name: Run scanner directly against semantic-lite-fixture
        run: |
          python3 scripts/pre_audit_scan.py \
            --root examples/semantic-lite-fixture \
            --protocol-type auto \
            --output examples/reports/semantic-lite-fixture-pre-audit-report.md \
            --json-output examples/reports/semantic-lite-fixture-pre-audit-report.json \
            --sarif-output examples/reports/semantic-lite-fixture.sarif.json \
            --baseline-output examples/reports/semantic-lite-fixture.baseline.json \
            --issue-checklist-output examples/reports/semantic-lite-fixture-issue-checklist.md \
            --issue-plan-output examples/reports/semantic-lite-fixture-issue-plan.json

      - name: Verify Slither unavailable path is graceful
        run: |
          python3 scripts/pre_audit_scan.py \
            --root examples/oracle-staking-fixture \
            --protocol-type auto \
            --output examples/reports/oracle-staking-fixture-slither-attempt-report.md \
            --json-output examples/reports/oracle-staking-fixture-slither-attempt-report.json \
            --slither

      - name: Dry-run GitHub issue workflow
        run: |
          python3 scripts/create_github_issues.py \
            --issue-plan examples/reports/vault-risk-fixture-issue-plan.json \
            --mode dry-run \
            --dry-run-output examples/reports/vault-risk-fixture-issue-dry-run.md \
            --max-issues 5

      - name: Dry-run public demo issue workflow
        run: |
          python3 scripts/create_github_issues.py \
            --issue-plan examples/reports/demo-issue-plan.json \
            --mode dry-run \
            --dry-run-output examples/reports/demo-issue-dry-run.md \
            --max-issues 5

      - name: Run scanner diff mode against vault-risk baseline
        run: |
          python3 scripts/pre_audit_scan.py \
            --root examples/vault-risk-fixture \
            --protocol-type vault \
            --compare-baseline examples/reports/vault-risk-fixture.baseline.json \
            --output examples/reports/vault-risk-fixture-diff-report.md \
            --json-output examples/reports/vault-risk-fixture-diff-report.json \
            --diff-output examples/reports/vault-risk-fixture-diff.md \
            --diff-json-output examples/reports/vault-risk-fixture-diff.json \
            --sarif-output examples/reports/vault-risk-fixture-diff.sarif.json \
            --summary-output examples/reports/vault-risk-fixture-diff-summary.md \
            --comment-output examples/reports/vault-risk-fixture-diff-comment.md \
            --issue-checklist-output examples/reports/vault-risk-fixture-diff-checklist.md

      - name: Run scanner with config suppression
        run: |
          python3 scripts/pre_audit_scan.py \
            --root examples/vault-risk-fixture \
            --protocol-type vault \
            --config examples/arkheionx.config.example.json \
            --output examples/reports/vault-risk-fixture-config-report.md \
            --json-output examples/reports/vault-risk-fixture-config-report.json \
            --summary-output examples/reports/vault-risk-fixture-config-summary.md \
            --comment-output examples/reports/vault-risk-fixture-config-comment.md \
            --issue-checklist-output examples/reports/vault-risk-fixture-config-checklist.md

      - name: Run local GitHub Action wrapper
        uses: ./.github/actions/pre-audit
        with:
          root: "examples/mini-vault"
          protocol-type: "auto"
          output: "ARKHEIONX_PRE_AUDIT_REPORT.md"
          json-output: "arkheionx-report.json"
          sarif-output: "arkheionx.sarif.json"
          baseline-output: "arkheionx.baseline.json"
          generate-invariant-skeletons: "false"
          fail-on-critical-readiness-gap: "false"
          summary: "true"
          pr-comment: "true"
          comment-output: "ARKHEIONX_PR_COMMENT.md"
          create-issue-checklist: "true"
          issue-checklist-output: "ARKHEIONX_ISSUE_CHECKLIST.md"
          issue-plan-output: "ARKHEIONX_ISSUE_PLAN.json"
          create-github-issues: "true"
          issue-create-mode: "dry-run"
          issue-dry-run-output: "ARKHEIONX_ISSUE_DRY_RUN.md"
          launch-report-output: "ARKHEIONX_LAUNCH_REPORT.md"
          sprint-plan-output: "ARKHEIONX_SPRINT_PLAN.md"
          sprint-days: "5"
          contest-readiness-output: "ARKHEIONX_CONTEST_READINESS.md"
          executive-summary-output: "ARKHEIONX_EXECUTIVE_SUMMARY.md"
          remediation-roadmap-output: "ARKHEIONX_REMEDIATION_ROADMAP.md"

      - name: Verify report artifacts
        run: |
          test -f examples/reports/mini-vault-pre-audit-report.md
          test -f examples/reports/mini-vault-pre-audit-report.json
          test -f examples/reports/mini-vault.sarif.json
          test -f examples/reports/mini-vault.baseline.json
          test -f examples/reports/vault-risk-fixture-pre-audit-report.md
          test -f examples/reports/vault-risk-fixture-pre-audit-report.json
          test -f examples/reports/vault-risk-fixture.sarif.json
          test -f examples/reports/vault-risk-fixture.baseline.json
          test -f examples/reports/mini-vault-action-summary.md
          test -f examples/reports/mini-vault-pr-comment.md
          test -f examples/reports/mini-vault-issue-checklist.md
          test -f examples/reports/mini-vault-issue-plan.json
          test -f examples/reports/vault-risk-fixture-action-summary.md
          test -f examples/reports/vault-risk-fixture-pr-comment.md
          test -f examples/reports/vault-risk-fixture-issue-checklist.md
          test -f examples/reports/vault-risk-fixture-issue-plan.json
          test -f examples/reports/vault-risk-fixture-issue-dry-run.md
          test -f examples/reports/oracle-staking-fixture-pre-audit-report.md
          test -f examples/reports/oracle-staking-fixture-pre-audit-report.json
          test -f examples/reports/oracle-staking-fixture.sarif.json
          test -f examples/reports/oracle-staking-fixture.baseline.json
          test -f examples/reports/oracle-staking-fixture-issue-checklist.md
          test -f examples/reports/oracle-staking-fixture-issue-plan.json
          test -f examples/reports/oracle-staking-fixture-launch-report.md
          test -f examples/reports/oracle-staking-fixture-sprint-plan.md
          test -f examples/reports/oracle-staking-fixture-contest-readiness.md
          test -f examples/reports/oracle-staking-fixture-executive-summary.md
          test -f examples/reports/oracle-staking-fixture-remediation-roadmap.md
          test -f examples/reports/demo-pre-audit-report.md
          test -f examples/reports/demo-report.json
          test -f examples/reports/demo.sarif.json
          test -f examples/reports/demo.baseline.json
          test -f examples/reports/demo-issue-plan.json
          test -f examples/reports/demo-issue-checklist.md
          test -f examples/reports/demo-launch-report.md
          test -f examples/reports/demo-sprint-plan.md
          test -f examples/reports/demo-contest-readiness.md
          test -f examples/reports/demo-executive-summary.md
          test -f examples/reports/demo-remediation-roadmap.md
          test -f examples/reports/demo-issue-dry-run.md
          test -f examples/reports/oracle-staking-fixture-fixed-pre-audit-report.md
          test -f examples/reports/oracle-staking-fixture-fixed-pre-audit-report.json
          test -f examples/reports/oracle-staking-fixture-fixed.baseline.json
          test -f examples/reports/oracle-staking-fixture-fixed-launch-report.md
          test -f examples/reports/oracle-staking-fixture-fixed-remediation-roadmap.md
          test -f examples/reports/oracle-staking-fixture-slither-attempt-report.md
          test -f examples/reports/oracle-staking-fixture-slither-attempt-report.json
          test -f examples/reports/semantic-lite-fixture-pre-audit-report.md
          test -f examples/reports/semantic-lite-fixture-pre-audit-report.json
          test -f examples/reports/semantic-lite-fixture.sarif.json
          test -f examples/reports/semantic-lite-fixture.baseline.json
          test -f examples/reports/semantic-lite-fixture-issue-checklist.md
          test -f examples/reports/semantic-lite-fixture-issue-plan.json
          test -f examples/reports/vault-risk-fixture-config-report.md
          test -f examples/reports/vault-risk-fixture-config-report.json
          test -f examples/reports/vault-risk-fixture-config-summary.md
          test -f examples/reports/vault-risk-fixture-config-comment.md
          test -f examples/reports/vault-risk-fixture-config-checklist.md
          test -f examples/reports/vault-risk-fixture-diff-report.md
          test -f examples/reports/vault-risk-fixture-diff-report.json
          test -f examples/reports/vault-risk-fixture-diff.md
          test -f examples/reports/vault-risk-fixture-diff.json
          test -f examples/reports/vault-risk-fixture-diff.sarif.json
          test -f examples/reports/vault-risk-fixture-diff-summary.md
          test -f examples/reports/vault-risk-fixture-diff-comment.md
          test -f examples/reports/vault-risk-fixture-diff-checklist.md
          test -f examples/mini-vault/test/invariant/ArkheionxReadinessInvariants.t.sol
          test -f examples/vault-risk-fixture/test/invariant/ArkheionxReadinessInvariants.t.sol
          test -f ARKHEIONX_PRE_AUDIT_REPORT.md
          test -f arkheionx-report.json
          test -f arkheionx.sarif.json
          test -f arkheionx.baseline.json
          test -f ARKHEIONX_ACTION_SUMMARY.md
          test -f ARKHEIONX_PR_COMMENT.md
          test -f ARKHEIONX_ISSUE_CHECKLIST.md
          test -f ARKHEIONX_ISSUE_PLAN.json
          test -f ARKHEIONX_ISSUE_DRY_RUN.md
          test -f ARKHEIONX_LAUNCH_REPORT.md
          test -f ARKHEIONX_SPRINT_PLAN.md
          test -f ARKHEIONX_CONTEST_READINESS.md
          test -f ARKHEIONX_EXECUTIVE_SUMMARY.md
          test -f ARKHEIONX_REMEDIATION_ROADMAP.md

      - name: Parse JSON output
        run: |
          python3 - <<'PY'
          import json

          for path in [
              "examples/reports/mini-vault-pre-audit-report.json",
              "examples/reports/vault-risk-fixture-pre-audit-report.json",
              "examples/reports/oracle-staking-fixture-pre-audit-report.json",
              "examples/reports/demo-report.json",
              "examples/reports/oracle-staking-fixture-fixed-pre-audit-report.json",
              "examples/reports/semantic-lite-fixture-pre-audit-report.json",
              "examples/reports/oracle-staking-fixture-slither-attempt-report.json",
              "arkheionx-report.json",
          ]:
              data = json.load(open(path, encoding="utf-8"))
              assert data["tool"] == "Arkheionx Pre-Audit Scanner"
              assert isinstance(data["score"], int)
              assert "disclaimer" in data
              assert "vault_rule_pack" in data
              assert "findings" in data
              assert "summary" in data
              assert "generated_outputs" in data
              assert "fingerprint_version" in data
              assert "rule_packs" in data
              assert "analysis_quality" in data
              assert "semantic_lite" in data
              assert "slither" in data
              assert "delivery_outputs" in data
              assert "delivery_summary" in data
              assert "knowledge" in data
              assert all(item["id"].startswith("ARK-") for item in data["findings"])
              assert all(item["fingerprint"] for item in data["findings"])
              assert all("confidence_reason" in item for item in data["findings"])
              assert all("detection_sources" in item for item in data["findings"])
              assert all("evidence" in item for item in data["findings"])
              assert all("knowledge" in item for item in data["findings"])
          oracle = json.load(open("examples/reports/oracle-staking-fixture-pre-audit-report.json", encoding="utf-8"))
          oracle_ids = {item["id"] for item in oracle["findings"]}
          assert "ARK-ORC-001" in oracle_ids
          assert "ARK-RWD-001" in oracle_ids
          for path in [
              "examples/reports/mini-vault-issue-plan.json",
              "examples/reports/vault-risk-fixture-issue-plan.json",
              "examples/reports/oracle-staking-fixture-issue-plan.json",
              "examples/reports/demo-issue-plan.json",
              "examples/reports/semantic-lite-fixture-issue-plan.json",
              "ARKHEIONX_ISSUE_PLAN.json",
          ]:
              plan = json.load(open(path, encoding="utf-8"))
              assert plan["issues"]
              assert all(issue["marker"].startswith("<!-- arkheionx-issue:") for issue in plan["issues"])
              assert all("not a formal audit finding" in issue["body"] for issue in plan["issues"])
              assert all("confidence_reason" in issue for issue in plan["issues"])
              assert all("evidence" in issue for issue in plan["issues"])
              assert all("related_knowledge" in issue for issue in plan["issues"])
          for path in [
              "metadata/security_memory_graph.json",
              "metadata/finding_knowledge_map.json",
              "metadata/rule_calibration_matrix.json",
          ]:
              payload = json.load(open(path, encoding="utf-8"))
              assert payload
          config = json.load(open("examples/reports/vault-risk-fixture-config-report.json", encoding="utf-8"))
          assert config["suppressed_findings"]
          for path in [
              "examples/reports/mini-vault.sarif.json",
              "examples/reports/vault-risk-fixture.sarif.json",
              "examples/reports/vault-risk-fixture-diff.sarif.json",
              "examples/reports/oracle-staking-fixture.sarif.json",
              "examples/reports/semantic-lite-fixture.sarif.json",
              "arkheionx.sarif.json",
          ]:
              sarif = json.load(open(path, encoding="utf-8"))
              assert sarif["version"] == "2.1.0"
              assert sarif["runs"][0]["tool"]["driver"]["rules"]
              assert sarif["runs"][0]["results"]
              assert sarif["runs"][0]["results"][0]["properties"]["not_a_vulnerability_confirmation"] is True
              assert sarif["runs"][0]["results"][0]["locations"]
          baseline = json.load(open("examples/reports/vault-risk-fixture.baseline.json", encoding="utf-8"))
          assert baseline["findings"] and all(item["fingerprint"] for item in baseline["findings"])
          diff = json.load(open("examples/reports/vault-risk-fixture-diff.json", encoding="utf-8"))
          assert "counts" in diff and "unchanged" in diff["counts"]
          print("JSON valid")
          PY

      - name: Verify generated UX files
        run: |
          grep -q "<!-- arkheionx-pre-audit-comment -->" examples/reports/mini-vault-pr-comment.md
          grep -q "<!-- arkheionx-pre-audit-comment -->" examples/reports/vault-risk-fixture-pr-comment.md
          grep -q "<!-- arkheionx-pre-audit-comment -->" ARKHEIONX_PR_COMMENT.md
          grep -q -- "- \\[ \\]" examples/reports/mini-vault-issue-checklist.md
          grep -q -- "- \\[ \\]" examples/reports/vault-risk-fixture-issue-checklist.md
          grep -q "<!-- arkheionx-issue:" examples/reports/vault-risk-fixture-issue-plan.json
          grep -q "No GitHub API calls were made." examples/reports/vault-risk-fixture-issue-dry-run.md
          grep -q "Score:" examples/reports/mini-vault-action-summary.md
          grep -q "Score:" examples/reports/vault-risk-fixture-action-summary.md
          grep -q "Suppressed Readiness Gaps" examples/reports/vault-risk-fixture-config-report.md
          grep -q "Baseline Diff" examples/reports/vault-risk-fixture-diff-report.md
          grep -q "Diff vs baseline" examples/reports/vault-risk-fixture-diff-comment.md
          grep -q "Score:" examples/reports/vault-risk-fixture-diff-summary.md
          grep -q "Executive Summary" examples/reports/oracle-staking-fixture-launch-report.md
          grep -q "Day 1" examples/reports/oracle-staking-fixture-sprint-plan.md
          grep -q "Day 5" examples/reports/oracle-staking-fixture-sprint-plan.md
          grep -q "Scope Preparation Checklist" examples/reports/oracle-staking-fixture-contest-readiness.md
          grep -q "Phase 1" examples/reports/oracle-staking-fixture-remediation-roadmap.md
          grep -q "No GitHub API calls were made." examples/reports/demo-issue-dry-run.md
          grep -q "Executive Summary" examples/reports/demo-launch-report.md
          grep -q "Scope Preparation Checklist" examples/reports/demo-contest-readiness.md
          grep -q "Phase 1" examples/reports/demo-remediation-roadmap.md
          test -f docs/TRY_IN_5_MINUTES.md
          test -f docs/PUBLIC_DEMO_WORKFLOW.md
          test -f docs/case-studies/ORACLE_STAKING_FIXTURE_CASE_STUDY.md
          test -f docs/case-studies/ORACLE_STAKING_BEFORE_AFTER.md
          test -f .github/ISSUE_TEMPLATE/false_positive_calibration.yml
          test -f .github/ISSUE_TEMPLATE/external_validation_feedback.yml
          test -f .github/workflows/arkheionx-demo.yml
          test -f metadata/security_memory_graph.json
          test -f metadata/finding_knowledge_map.json
          test -f metadata/rule_calibration_matrix.json
          test -f reports/security_memory_graph.md
          test -f reports/security_memory_graph_summary.md
          grep -q "Related Knowledge" examples/reports/demo-pre-audit-report.md
          grep -q "Related Knowledge" examples/reports/demo-issue-plan.json

      - name: Verify disclaimer is present
        run: |
          grep -qi "not a formal audit" examples/reports/mini-vault-pre-audit-report.md
          grep -qi "does not prove" examples/reports/mini-vault-pre-audit-report.md
          grep -qi "formal audit is recommended" examples/reports/mini-vault-pre-audit-report.md
          grep -qi "not a formal audit" examples/reports/vault-risk-fixture-pre-audit-report.md
          grep -qi "Vault Rule Pack Coverage" examples/reports/vault-risk-fixture-pre-audit-report.md
          grep -qi "Rule Pack Coverage" examples/reports/oracle-staking-fixture-pre-audit-report.md
          grep -qi "Analysis Quality" examples/reports/semantic-lite-fixture-pre-audit-report.md
          grep -qi "Evidence" examples/reports/semantic-lite-fixture-pre-audit-report.md
          grep -qi "not a formal audit" examples/reports/oracle-staking-fixture-launch-report.md

name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Forge fmt
        run: forge fmt --check
      - name: Forge build
        run: forge build
      - name: Forge test
        run: forge test -vvv
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}

name: metadata

on:
  push:
    branches: [main]
    paths:
      - 'metadata/**'
      - 'reports/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/metadata.yml'
  pull_request:
    paths:
      - 'metadata/**'
      - 'reports/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/metadata.yml'

permissions:
  contents: read

jobs:
  validate:
    name: validate registry + check generated artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate metadata
        run: python3 scripts/validate_metadata.py

      - name: Verify registry README block is up to date
        run: python3 scripts/generate_registry.py --check

      - name: Verify quality matrix is up to date
        run: python3 scripts/score_pocs.py --check

      - name: Verify verification report skeletons are up to date
        run: python3 scripts/generate_verification_report.py --check

      - name: Verify maturity index is up to date
        run: python3 scripts/poc_maturity_index.py --check

      - name: Verify research dashboard is up to date
        run: python3 scripts/research_dashboard.py --check

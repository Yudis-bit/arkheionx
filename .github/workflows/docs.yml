name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  required-docs:
    name: required docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required documentation files exist
        run: |
          set -e
          required=(
            docs/BRAND.md
            docs/CONTRIBUTING.md
            docs/ETHICS.md
            docs/METADATA_SCHEMA.md
            docs/POC_MATURITY_MODEL.md
            docs/RELEASE_PROCESS.md
            docs/RELEASE_CHECKLIST.md
            docs/LAUNCH_PLAN.md
            docs/REPRODUCIBILITY.md
            docs/RESEARCH_STANDARD.md
            docs/ROADMAP.md
            docs/SECURITY.md
            docs/STYLEGUIDE.md
            docs/VM_SUPPORT.md
            metadata/backlog/priority-lanes.md
            metadata/backlog/rejection-criteria.md
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty: $f"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All required docs present."

  banned-phrases:
    name: banned phrases on public surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan README + docs for hype framings
        run: |
          set -e
          # Scope: README + docs/, but NOT docs/internal/ (phase logs may
          # legitimately mention these phrases when documenting the
          # prohibition itself), NOT docs/BRAND.md (defines the list),
          # NOT metadata/backlog/rejection-criteria.md (lists the bans).
          targets=$(git ls-files 'README.md' 'docs/*.md' \
            ':!docs/internal/**' ':!docs/BRAND.md')
          banned='\b(world-class|industry-leading|military-grade|trusted by [A-Z])'
          if printf '%s\n' $targets | xargs grep -InE "$banned" 2>/dev/null; then
            echo "::error::banned hype phrasing detected on the public surface"
            exit 1
          fi
          echo "No banned hype framings detected."

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arkheionx"
version = "9.0.0.dev0"
description = "Local-first security research workflow for Solidity and DeFi repositories: turn scope, value flow, protocol behavior, invariants, and local evidence into focused review lanes before report writing."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Yudistira Putra" }
]
keywords = [
  "defi-security",
  "smart-contract-security",
  "value-flow",
  "security-testing",
  "audit-readiness",
  "test-coverage",
  "sarif",
  "foundry",
  "solidity"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Yudis-bit/DeFi-Exploit-PoCs"
Documentation = "https://github.com/Yudis-bit/DeFi-Exploit-PoCs#readme"

[project.scripts]
arkheionx = "arkheionx.cli.main:main"

[tool.setuptools.packages.find]
include = ["arkheionx*"]

[tool.setuptools.package-data]
"arkheionx.demo.fixtures" = ["**/*.md", "**/*.toml", "**/*.sol"]

# Ship the JSON schemas (including the v7.5 lens schemas) inside the built
# distribution so the installed artifact carries its own schema definitions.
# They install under <prefix>/share/arkheionx/schemas/ and appear in the wheel
# under the ".data/data/share/arkheionx/schemas/" path.
[tool.setuptools.data-files]
"share/arkheionx/schemas" = ["schemas/*.json"]
